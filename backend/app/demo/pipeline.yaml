# DAG Flow — declarative pipeline example.
#
# 节点函数在 Python 侧注册(见 app/demo/functions.py 的 FUNCTIONS),
# 这个文件只声明编排结构:依赖、重试、条件分支、人工审核。
#
# 加载方式:
#     dag = load_dag("pipeline.yaml", functions=FUNCTIONS)
#     results = await dag.run(dag.default_inputs or None)

name: content_pipeline

nodes:
  fetch:
    type: cfg_fetch
    retry: 2                     # 简写:重试 2 次

  clean:
    type: cfg_clean
    depends_on: [fetch]

  enrich:
    type: cfg_enrich
    depends_on: [fetch]          # 与 clean 并行

  merge:
    type: cfg_merge
    depends_on: [clean, enrich]  # 等两者都完成

  review:
    kind: human                  # 人工审核节点
    depends_on: [merge]
    prompt: "Please review the merged result. Type y to approve / n to reject."

  publish:
    type: cfg_publish
    depends_on: [review]         # 被拒绝时级联跳过

  report:
    type: cfg_report
    depends_on: [merge]
    condition: cfg_needs_report  # 条件分支:返回 True 才执行

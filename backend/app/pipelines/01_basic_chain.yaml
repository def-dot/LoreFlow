# DAG Flow — 实际示例：RAG 文档入库的最简串行链。
#
# 节点函数在 Python 侧用 @node 装饰器注册（见 app/registry），
# 这个文件只声明编排结构。
#
# 加载方式：
#     from app.engine import load_dag
#     dag = load_dag("app/pipelines/01_basic_chain.yaml")
#     results = await dag.run()

name: 文档入库
description: 实际示例：加载文档 → 切块 → 向量化 → 写入向量库。

nodes:
  load:
    type: rag_load           # 加载设定文档，输出 {doc_id, title, text}

  chunk:
    type: rag_chunk
    depends_on: [load]       # 按空行切成语义段

  embed:
    type: rag_embed
    depends_on: [chunk]      # 每段生成向量

  upsert:
    type: rag_upsert
    depends_on: [embed]      # 批量写入向量库

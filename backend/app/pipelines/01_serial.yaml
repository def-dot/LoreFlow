name: 串行
description: RAG文档入库串行执行：上传文档 → 切块 → 向量化 → 写入向量库。

inputs:
  document:
    required: true
    file: true
    label: 上传文档
    description: 上传 txt/md 等文本文件入库

nodes:
  load:
    type: rag_load
    label: 文档解析

  chunk:
    type: rag_chunk
    label: 切块
    depends_on: [load]
    inputs: {document: $load}

  embed:
    type: rag_embed
    label: 向量化
    depends_on: [chunk]
    inputs: {document: $load, chunks: $chunk}

  upsert:
    type: rag_upsert
    label: 写入向量库
    depends_on: [embed]
    inputs: {document: $load, embeds: $embed}

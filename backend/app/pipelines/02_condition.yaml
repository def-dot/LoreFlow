name: 客服分流
description: 意图识别分流：简单问答检索知识库后 AI 自动回复；复杂诉求转人工客服接管。

params:
  prompt:
    required: true
    multiline: true
    label: 用户诉求
    description: 用户的问题或诉求，由 LLM 判断走哪条支路

nodes:
  classify:
    type: llm_classify
    routes:                        # 边级路由：一处声明，未选中支路整条 SKIPPED
      router: route_intent        # 注册表路由函数：读 classify 输出返回支路标签
      default: simple             # 标签未命中时回落；不声明则路由失败（run 失败）
      branches:
        simple: [retrieve, auto_reply]
        complex: [takeover]

  retrieve:                       # 支路成员不用再逐个挂 condition
    type: rag_retrieve
    depends_on: [classify]

  auto_reply:
    type: llm_rag_reply
    depends_on: [retrieve]

  takeover:
    kind: human
    depends_on: [classify]
    prompt: "复杂诉求：请人工客服接管处理。"
    review:
      prompt: {label: 用户诉求}

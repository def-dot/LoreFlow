name: 条件分支
description: 客服分流：闲聊 LLM 直接回答；知识类问题先检索知识库再作答；提示词包含「人工」转人工客服。

params:
  prompt:
    required: true
    multiline: true
    label: 用户诉求
    description: 任意问题或闲聊；包含「人工」直接转人工客服

nodes:
  意图识别:
    type: llm_classify 

  LLM回答:
    type: llm_chat
    depends_on: [意图识别]
    condition: {fn: intent_is, value: chat}

  知识库检索:
    type: rag_retrieve
    depends_on: [意图识别]
    condition: {fn: intent_is, value: rag}

  LLM检索回答:
    type: llm_rag_reply
    depends_on: [知识库检索]

  人工客服:
    kind: human
    depends_on: [意图识别]
    condition: {fn: intent_is, value: human}
    prompt: "用户点名转人工：请人工客服接管处理。"
    review:
      prompt: {label: 用户诉求}

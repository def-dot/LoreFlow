name: 条件分支
description: 客服分流：闲聊 LLM 直接回答；知识类问题先检索知识库再作答；提示词包含「人工」转人工客服。

inputs:
  prompt:
    required: true
    multiline: true
    label: 用户诉求
    description: 任意问题或闲聊；包含「人工」直接转人工客服

nodes:
  intent_recognition:
    type: llm_classify
    label: 意图识别

  llm_chat:
    type: llm_chat
    label: LLM回答
    depends_on: [intent_recognition]
    condition: $intent_recognition.intent == chat

  rag_retrieve:
    type: rag_retrieve
    label: 知识库检索
    depends_on: [intent_recognition]
    condition: $intent_recognition.intent == rag

  llm_rag_reply:
    type: llm_rag_reply
    label: LLM检索回答
    depends_on: [rag_retrieve]
    inputs: {chunks: $rag_retrieve}

  human_service:
    kind: human
    label: 人工客服
    depends_on: [intent_recognition]
    condition: intent == human
    inputs: {intent: $intent_recognition.intent}
    prompt: "用户点名转人工：请人工客服接管处理。"
    review:
      prompt: {label: 用户诉求}

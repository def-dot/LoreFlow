name: 条件分支
description: 客服分流：闲聊 LLM 直接回答；知识类问题先检索知识库再作答；提示词包含「人工」转人工客服。

inputs:
  prompt:
    required: true
    multiline: true
    label: 用户诉求
    description: 任意问题或闲聊；包含「人工」直接转人工客服

nodes:
  intent_recognition:
    type: llm_classify
    label: 意图识别

  llm_chat:
    type: llm_chat
    label: LLM回答
    depends_on: [intent_recognition]
    condition: $intent_recognition.intent == chat

  rag_retrieve:
    type: rag_retrieve
    label: 知识库检索
    depends_on: [intent_recognition]
    condition: $intent_recognition.intent == rag

  llm_rag_reply:
    type: llm_rag_reply
    label: LLM检索回答
    depends_on: [rag_retrieve]
    inputs: {chunks: $rag_retrieve}

  # 汇合节点（any-success 语义）：互斥支路必有一条跑成，按 depends_on 声明
  # 顺序自动取第一个非空支路输出作为最终结果（无需 inputs 接线）；
  # 全跳过（如 intent=human）时本节点级联跳过
  final_answer:
    type: final_answer
    label: 最终答复
    depends_on: [llm_chat, llm_rag_reply]

# DAG Flow — 条件分支示例：LLM 意图路由。
#
# condition 引用注册表里的条件谓词（is_chat / is_rag，读 classify 输出），
# 返回 False 的节点状态为 SKIPPED。注意 SKIPPED 不级联：闲聊路径上
# retrieve 被跳过后，rag_reply 若不自带 condition 仍会执行（此时 ctx
# 没有 retrieve 输出），因此知识支路两个节点都要挂 is_rag。
#
# 前置：Ollama 服务可用（.env 配 OLLAMA_BASE_URL / OLLAMA_MODEL）。
name: 意图路由
description: 实际示例：LLM 判断提示词意图 —— 闲聊直接回复；知识类走（模拟）RAG 检索后作答。

params:
  prompt:
    required: true
    multiline: true
    label: 提示词
    description: 任意问题或闲聊，由 LLM 判断走哪条支路

nodes:
  classify:
    type: llm_classify          # LLM 意图分类，输出 {intent: chat|rag, raw}

  chat_reply:
    type: llm_chat              # 闲聊支路：直接回答
    depends_on: [classify]
    condition: is_chat

  retrieve:
    type: rag_retrieve          # 知识支路：模拟 RAG 检索（关键词打分）
    depends_on: [classify]
    condition: is_rag

  rag_reply:
    type: llm_rag_reply         # 知识支路：结合检索片段作答
    depends_on: [retrieve]
    condition: is_rag           # SKIPPED 不级联，闲聊路径这里也要挡住

name: 人工审核
description: 内容发布审批：审批通过才发布。

inputs:
  title:
    required: true
    label: 标题
    description: 待审核文章标题
  content:
    required: true
    label: 正文
    description: 待审核文章正文
    multiline: true

nodes:
  review:
    type: human
    label: 内容审核
    inputs:
      _prompt: "请审核文章内容是否可以发布"
      # 声明即卡片：title/content 是参数键，值已在 ctx，直引即可
      _review: {title: 标题, content: 正文}

  publish:
    type: cfg_publish
    depends_on: [review]

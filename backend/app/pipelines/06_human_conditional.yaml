# DAG Flow — 按需审核示例：human 节点同样支持 condition。
#
# demo_needs_review：合并正文超过 30 字符才需要人工审核。
# 演示数据正文只有 26 字符 → review 被 SKIPPED，approver 根本不会被调用，
# 流水线不挂起、继续执行（HITL 最常见模式：只有低置信度结果才送审）。
#
# 想看到审核真正发生：把 app/registry/functions.py 里
# demo_needs_review 的阈值改成 20 再跑。

name: human_conditional
description: 按需审核示例：human 节点带 condition，不满足时自动跳过审核、不挂起流水线。

nodes:
  fetch:
    type: cfg_fetch

  clean:
    type: cfg_clean
    depends_on: [fetch]

  enrich:
    type: cfg_enrich
    depends_on: [fetch]

  merge:
    type: cfg_merge
    depends_on: [clean, enrich]

  review:
    kind: human
    depends_on: [merge]
    condition: demo_needs_review
    prompt: "请审核合并结果。"

  report:
    type: cfg_report
    depends_on: [merge]      # 不依赖 review：审核被跳过时照常执行

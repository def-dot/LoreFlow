name: 人工多级审核
description: 内容发布多级审批：编辑初审、主编终审，两审都通过才发布。

params:
  title:
    required: true
    label: 标题
    description: 待审文章标题
  content:
    required: true
    label: 正文
    description: 待审文章正文
    multiline: true

nodes:
  编辑初审:
    kind: human
    prompt: "初审把关：标题达意、正文完整可读再通过。"
    # 审核视图
    review:
      title: {label: 标题}
      content: {label: 正文}

  主编终审:
    kind: human
    depends_on: [编辑初审]
    prompt: "终审把关：确认可对外发布再通过。"
    # 终审视图
    review:
      title: {label: 标题}
      content: {label: 正文}

  发布:
    type: cfg_publish
    depends_on: [主编终审]

name: 人工多级审核
description: 内容发布多级审批：编辑初审、主编终审，两审都通过才发布。

inputs:
  title:
    required: true
    label: 标题
    description: 待审文章标题
  content:
    required: true
    label: 正文
    description: 待审文章正文
    multiline: true

nodes:
  first_review:
    type: human
    label: 编辑初审
    inputs:
      _prompt: "初审把关：标题达意、正文完整可读再通过。"
      _review:
        title: 标题
        content: 正文

  # 终审看到的是初审修订后的生效值：卡片字段平铺在决策里，直接引用；
  # 来源不同 → 接线条目
  final_review:
    type: human
    label: 主编终审
    depends_on: [first_review]
    inputs:
      _prompt: "终审把关：确认可对外发布再通过。"
      _review:
        title: 标题
        content: 正文
      title: $first_review.decision.title
      content: $first_review.decision.content

  publish:
    type: cfg_publish
    label: 发布
    depends_on: [final_review]

# 两级审核 — 待发布内容为运行时必填参数（params 富声明，无默认值）：
#   新建运行「⚙ 参数」表单里填 标题/正文 两个必填字段（可切 JSON 模式）
#   缺 title / content → 400 拒绝创建（前端弹层会标 * 拦截）
# 两级审批（编辑初审 → 主编终审）通过后发布。
name: 多级审核
description: 内容发布多级审批：编辑初审、主编终审，两审都通过才发布。

params:
  title:
    required: true
    label: 标题
    description: 待审文章标题
  content:
    required: true
    label: 正文
    description: 待审文章正文
    multiline: true

nodes:
  编辑初审:
    kind: human
    # prompt = 给审核者的把关指引（审核卡片置顶显示）；按钮/终端操作方式不写进来
    prompt: "初审把关：标题达意、正文完整可读再通过。"
    # 审核视图：只看待发布的 title/content，不看其他上下文
    review:
      title: {label: 标题}
      content: {label: 正文}

  主编终审:
    kind: human
    depends_on: [编辑初审]
    prompt: "终审把关：确认可对外发布再通过。"
    # 终审同样只看内容本身；一审的决策记录不进视图（节点表里仍可查）
    review:
      title: {label: 标题}
      content: {label: 正文}

  发布:
    type: cfg_publish
    depends_on: [主编终审]

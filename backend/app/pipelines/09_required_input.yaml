# 必填参数示例 — params 富声明：query 必填（创建时校验），topic 可选带默认。
#   新建运行「⚙ 参数」表单里填 查询词（必填），主题 不填则用默认值。
name: 必填参数
description: 运行时必填参数示例：query 必须提供（创建时校验），topic 有默认值可覆盖。

params:
  query:
    required: true
    label: 查询词
    description: 要检索的内容，创建运行时必须提供
  topic:
    default: 默认主题
    label: 主题
    description: 检索主题，不填用默认值

nodes:
  检索:
    type: demo_search

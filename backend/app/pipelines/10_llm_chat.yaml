name: LLM 对话 - 支持链接
description: 用户输入提示词；如果包含链接会先抓取网页正文，再一起交给 Ollama 生成回答。

params:
  prompt:
    required: true
    multiline: true
    label: 提示词
    description: 发给 LLM 的内容；含 http(s) 链接时自动抓取网页正文作参考

nodes:
  pages:
    type: web_fetch

  chat:
    type: llm_chat
    depends_on: [pages]
    timeout: 300

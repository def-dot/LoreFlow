name: 并行
description: Fan-out/fan-in 并行示例：fetch 后 clean 和 enrich 同时执行，merge 等两者完成再汇总。

nodes:
  fetch:
    type: cfg_fetch
    label: 抓取数据

  clean:
    type: cfg_clean
    label: 清洗正文
    depends_on: [fetch]
    inputs: {fetch: $fetch}

  enrich:
    type: cfg_enrich
    label: 富化标题
    depends_on: [fetch]
    inputs: {fetch: $fetch}

  merge:
    type: cfg_merge
    label: 合并结果
    depends_on: [clean, enrich]
    inputs: {clean: $clean, enrich: $enrich}

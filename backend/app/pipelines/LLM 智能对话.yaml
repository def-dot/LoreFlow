name: LLM 智能对话
description: LLM 判断是否需要联网搜索——需要时先检索再汇总回复，不需要时直接回复。

output:
  search_reply: $search_reply
  direct_reply: $direct_reply

inputs:
  prompt:
    required: true
    multiline: true
    label: 提示词
    description: 用户输入的问题

nodes:
  classify:
    type: llm_classify
    label: 意图识别
    description: 识别用户意图：chat（直接回复）或 search（需要联网搜索）
    inputs:
      classify_system: >-
        你是意图分类器，只允许输出 chat 或 search 两个单词之一，
        禁止输出其他任何内容（包括标点、解释或其他语言）：
        chat —— 问候、闲聊、创作、翻译、一般知识问答等；
        search —— 需要联网搜索最新信息才能回答（时事新闻、实时数据、
        股价、天气、最新发布等你知识截止日期之后的内容）
      classify_labels: [chat, search]

  search:
    type: web_search
    label: 网络搜索
    description: 根据用户问题搜索互联网
    depends_on: [classify]
    condition: $classify.intent == "search"

  format_search:
    type: code
    label: 格式化搜索结果
    description: 将搜索结果格式化为可读文本
    depends_on: [search]
    inputs:
      search: $search
      script: |
        if not isinstance(search, list):
            result = ""
        else:
            lines = []
            for i, r in enumerate(search, 1):
                title = r.get("title", "")
                url = r.get("url", "")
                snippet = r.get("snippet", "")
                lines.append(f"[{i}] {title}\n{url}\n{snippet}")
            result = "\n\n".join(lines)

  search_reply:
    type: llm_chat
    label: 搜索汇总回复
    description: 将搜索结果与原始问题一起交给 LLM 总结
    depends_on: [format_search]
    inputs:
      context: $format_search
    timeout: 300

  direct_reply:
    type: llm_chat
    label: 直接回复
    description: 无需搜索，LLM 直接回答
    depends_on: [classify]
    condition: $classify.intent != "search"
    timeout: 300

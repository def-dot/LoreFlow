name: 串行
description: RAG文档入库串行执行：上传文档 → 切块 → 向量化 → 写入向量库。
nodes:
- name: __start__
  type: start
  inputs:
    document: $input.document
- name: load
  type: rag_load
  label: 文档解析
  inputs:
    document: $input.document
  depends_on:
  - __start__
- name: chunk
  type: rag_chunk
  label: 切块
  depends_on:
  - load
  inputs:
    text: $load.text
- name: embed
  type: rag_embed
  label: 向量化
  depends_on:
  - chunk
  - load
  inputs:
    doc_name: $load.doc_name
    chunks: $chunk.result
- name: upsert
  type: rag_upsert
  label: 写入向量库
  depends_on:
  - embed
  - load
  inputs:
    doc_name: $load.doc_name
    embeds: $embed.result
params:
  document:
    required: true
    type: file
    label: 上传文档
    description: 上传 txt/md 等文本文件入库

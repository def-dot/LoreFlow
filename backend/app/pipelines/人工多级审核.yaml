name: 人工多级审核
description: 内容发布多级审批：编辑初审、主编终审，两审都通过才发布。
nodes:
- name: __start__
  type: start
  inputs:
    title:
      required: true
      label: 标题
      description: 待审文章标题
    content:
      required: true
      label: 正文
      description: 待审文章正文
      type: paragraph
- name: first_review
  type: human
  label: 编辑初审
  description: 初审把关：标题达意、正文完整可读再通过。
  depends_on: __start__
  inputs:
    payload:
      - key: title
        label: 标题
        value: $__start__.title
      - key: content
        label: 正文
        value: $__start__.content
- name: final_review
  type: human
  label: 主编终审
  depends_on: first_review
  description: 终审把关：确认可对外发布再通过。
  inputs:
    payload:
      - key: title
        label: 标题
        value: $first_review.result.title
      - key: content
        label: 正文
        value: $first_review.result.content
- name: publish
  type: publish
  label: 发布
  depends_on: final_review
  inputs:
    title: $final_review.result.title
    content: $final_review.result.content
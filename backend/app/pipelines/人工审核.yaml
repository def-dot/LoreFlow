name: 人工审核
description: 内容发布审批：审批通过才发布。
nodes:
- name: __start__
  type: start
  inputs:
    title:
      required: true
      label: 标题
      description: 待审核文章标题
    content:
      required: true
      label: 正文
      description: 待审核文章正文
      type: paragraph
- name: review
  type: human
  label: 内容审核
  description: 请审核文章内容是否可以发布
  depends_on: __start__
  inputs:
    payload:
      - key: title
        label: 标题
        value: $__start__.title
      - key: content
        label: 正文
        value: $__start__.content
- name: publish
  type: publish
  label: 内容发布
  depends_on: review
  inputs:
    title: $review.result.title
    content: $review.result.content
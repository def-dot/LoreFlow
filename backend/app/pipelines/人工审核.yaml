name: 人工审核
description: 内容发布审批：审批通过才发布。
nodes:
- name: __start__
  type: start
  inputs:
    title:
      required: true
      label: 标题
      description: 待审核文章标题
    content:
      required: true
      label: 正文
      description: 待审核文章正文
      type: paragraph
- name: review
  type: human
  label: 内容审核
  description: 请审核文章内容是否可以发布
  inputs:
    标题: $__start__.title
    正文: $__start__.content
- name: publish
  type: cfg_publish
  label: 内容发布
  depends_on:
  - review
  inputs:
    title: $review.result.标题
    content: $review.result.正文
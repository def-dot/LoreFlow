name: 基础测试-重试（成功）
description: 随机失败触发重试，最终成功。
nodes:
- name: task_a
  type: code
  label: 随机失败
  inputs:
    script: |
      import random
      def main():
          if random.random() < 0.7:
              raise Exception("服务暂时不可用")
          return {"status": "success"}
  retry:
    max_retries: 5
    backoff_base: 1
    backoff_factor: 2
    backoff_max: 10
    jitter: true
- name: __end__
  label: 输出
  depends_on:
  - task_a
  type: end
  inputs:
    result: $task_a.result
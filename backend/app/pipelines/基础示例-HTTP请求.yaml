name: 基础示例-HTTP请求
description: LLM 根据问题自动决定是否调用搜索或计算工具。
nodes:
- name: chat
  type: llm_chat
  label: 智能回答
  inputs:
    prompt: $params.prompt
    system: '你是一个简洁的助手。

      不需要工具就能回答的问题直接回复；需要搜索或计算时调用工具，拿到结果后再总结回答。
      '
    tools:
    - web_search
    - run_code
- name: __end__
  label: 输出
  depends_on:
  - chat
  type: end
  inputs:
    answer: $chat.content
params:
  prompt:
    required: true
    type: paragraph
    label: 问题
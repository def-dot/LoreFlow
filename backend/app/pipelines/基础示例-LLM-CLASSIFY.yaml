name: 基础示例-LLM-CLASSIFY
description: 根据用户输入识别心情：开心 / 难过 / 生气 / 平静。
nodes:
- name: classify
  type: llm_classify
  label: 心情识别
  inputs:
    prompt: $params.prompt
    classify_labels:
    - 开心
    - 难过
    - 生气
    - 平静
    classify_system: 你是心情识别器，根据用户输入判断其心情，只允许输出 开心、难过、生气、平静 之一，禁止输出其他内容。
- name: __end__
  label: 输出
  depends_on:
  - classify
  type: end
  inputs:
    mood: $classify.intent
params:
  prompt:
    required: true
    type: paragraph
    label: 说点什么
    description: 输入一句话，识别你的心情
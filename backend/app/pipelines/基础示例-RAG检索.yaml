name: 基础示例-RAG检索
description: 知识库检索 + LLM 问答。先从知识库召回相关片段，再拼接上下文让 LLM 回答。
nodes:
- name: search
  type: retrieve_knowledge
  label: 知识库检索
  inputs:
    queries: $params.question
    tags: $params.tags
- name: answer
  type: llm_chat
  label: LLM回答
  depends_on:
  - search
  inputs:
    prompt: |
      参考资料：$search.context

      问题：$params.question
    system: |
      你是知识库问答助手。根据以下检索到的参考资料回答用户问题。
      如果资料中没有相关信息，请如实说明。
- name: __end__
  label: 输出
  depends_on:
  - answer
  type: end
  inputs:
    answer: $answer.content
    sources: $search.context
params:
  question:
    type: string
    title: 用户问题
    description: 输入要检索的问题
    ui: textarea
  tags:
    type: array
    title: 标签筛选
    description: 按标签过滤知识库，不选则检索全部
    items:
      type: string
      enum: [财务, 人事, 客服, 技术]
    ui: select
required:
- question
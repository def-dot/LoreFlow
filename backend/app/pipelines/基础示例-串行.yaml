name: 基础示例-串行
description: 三个节点依次执行，演示 depends_on 串联用法。
nodes:
- name: task_a
  type: code
  label: 任务A
  inputs:
    script: "def main():\n    import time\n    time.sleep(2)\n    return '我是A'\n"
- name: task_b
  type: code
  label: 任务B
  depends_on:
  - task_a
  inputs:
    script: "def main():\n    import time\n    time.sleep(5)\n    return '我是B'\n"
- name: __end__
  label: 输出
  depends_on:
  - task_b
  type: end
  inputs:
    result: $task_b.result
name: 基础示例-人工
description: 输入内容 → 人工审批 → 输出审核结果。
metadata:
  agent_tool: false
nodes:
- name: task_a
  type: human
  label: 内容审核
  description: 请审核内容是否正确
  inputs:
    content: $params.content
- name: __end__
  label: 输出
  depends_on:
  - task_a
  type: end
  inputs:
    result: $task_a
params:
  content:
    type: string
    description: 内容
    ui: textarea
required:
- content

name: 基础示例-代码
description: 输入两个数字 → 加法计算 → 输出结果。
nodes:
- name: task_a
  type: code
  label: 加法计算器
  inputs:
    code: "def main(a:int, b:int):\n    return a+b\n"
    a: $params.a
    b: $params.b
- name: __end__
  label: 输出
  depends_on:
  - task_a
  type: end
  inputs:
    result: $task_a.result
params:
  a:
    type: number
    title: a
  b:
    type: number
    title: b
required:
- a
- b

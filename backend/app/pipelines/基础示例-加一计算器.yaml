name: 基础示例-加一计算器
metadata:
  agent_tool: true
  tool_name: add_one_calculator
description: 加一计算器：输入一个数字，加一计算，输出结果。
nodes:
- name: task_a
  type: code
  label: 加一计算器
  inputs:
    code: "def main(a:int):\n    return a+1\n"
    a: $params.x
- name: __end__
  label: 输出
  depends_on:
  - task_a
  type: end
  inputs:
    result: $task_a.result
params:
  x:
    type: number
    title: x
    description: 输入一个数字，计算加一。
required:
- x

name: 基础示例-并行
description: 两个节点同时执行，互不依赖。
nodes:
- name: task_a
  type: code
  label: 任务A
  inputs:
    code: "def main():\n    import time\n    time.sleep(2)\n    return '我是A'\n"
- name: task_b
  type: code
  label: 任务B
  inputs:
    code: "def main():\n    import time\n    time.sleep(5)\n    return '我是B'\n"
- name: __end__
  label: 输出
  depends_on:
  - task_a
  - task_b
  type: end
  inputs:
    a: $task_a.result
    b: $task_b.result
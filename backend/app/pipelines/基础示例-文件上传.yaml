name: 基础示例-文件上传
description: 上传文件，读取文件内容。
nodes:
- name: task_a
  type: read_document
  label: 读取文件
  inputs:
    document: $params.file
- name: __end__
  label: 输出
  depends_on:
  - task_a
  type: end
  inputs:
    result: $task_a.text
params:
  file:
    type: object
    title: 上传文件
    description: 上传 txt/md 等文本文件
    properties:
      stored_name: {type: string}
      filename: {type: string}
    ui: file
required:
- file

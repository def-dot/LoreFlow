name: 基础测试-输入参数(选项)
description: 选项参数示例：select 单选（标量）、checkbox 多选（列表）。
nodes:
- name: greet
  type: code
  label: 生成问候
  inputs:
    script: "def main(lang, tags):\n    texts = {'中文': '你好！', 'English': 'Hello!', '日本語': 'こんにちは！'}\n    hello = texts.get(lang, f'未知选项: {lang}')\n    return hello + ' 标签: ' + ', '.join(tags or [])\n"
    params:
      lang: $params.lang
      tags: $params.tags
- name: __end__
  label: 输出
  depends_on:
  - greet
  type: end
  inputs:
    result: $greet.result
params:
  lang:
    required: true
    type: select
    label: 语言
    description: 单选，提交标量字符串
    options:
    - 中文
    - English
    - 日本語
    default: 中文
  tags:
    type: checkbox
    label: 标签
    description: 多选，提交字符串列表
    options:
    - 问候
    - 正式
    - 随意
    default:
    - 问候

name: 基础示例-输入参数
description: 输入参数全类型示例：text / textarea / number / select / multiselect / checkbox / file（object） / file_list（array）。
nodes:
- name: summary
  type: code
  label: 汇总参数
  inputs:
    code: |
      def main(text, paragraph, number, lang, langs, tags, file, file_list):
          def fmt_file(f):
              return f["filename"] if isinstance(f, dict) else str(f)

          files = [fmt_file(f) for f in (file_list or [])] if isinstance(file_list, list) else []
          lines = [
              f"text（单行文本）: {text!r}",
              f"paragraph（多行文本）: {paragraph!r}",
              f"number（数字）: {number!r}",
              f"select（单选）: {lang!r}",
              f"multiselect（下拉多选）: {langs!r}",
              f"checkbox（多选）: {tags!r}",
              f"file（单文件）: {fmt_file(file) if file else '（未上传）'}",
              f"file_list（多文件）: {', '.join(files) if files else '（未上传）'}",
          ]
          return "\n".join(lines)
    text: $params.text
    paragraph: $params.paragraph
    number: $params.number
    lang: $params.lang
    langs: $params.langs
    tags: $params.tags
    file: $params.file
    file_list: $params.file_list
- name: __end__
  label: 输出
  depends_on:
  - summary
  type: end
  inputs:
    result: $summary.result
params:
  text:
    type: string
    description: 单行文本
    default: 你好
  paragraph:
    type: string
    title: 多行文本
    description: 多行文本
    default: |-
      第一行
      第二行
    ui: textarea
  number:
    type: number
    description: 数字
    default: 3
  lang:
    type: string
    description: 单选
    enum: [中文, English, 日本語]
    default: 中文
    ui: select
  langs:
    type: array
    description: 下拉多选
    items:
      type: string
      enum: [问候, 正式, 随意, 紧急]
    default: [问候, 正式]
    ui: select
  tags:
    type: array
    description: 多选
    items:
      type: string
      enum: [问候, 正式, 随意, 紧急]
    default: [问候]
    ui: checkbox
  file:
    type: string
    description: 单文件
    ui: file
  file_list:
    type: array
    description: 多文件
    items:
      type: string
    ui: file_list
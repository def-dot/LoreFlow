name: 完整示例-RAG检索
description: 知识库问答（意图分类 → 查询改写 → 检索 → 回答）。LLM 判断意图后，rag 类问题自动改写、拆分、并发检索、去重，基于结果生成回答。
params:
  query:
    type: text
    required: true
    label: 用户问题
    description: 输入要检索的问题
  history:
    type: paragraph
    label: 对话历史
    description: JSON 格式的对话历史（可选）
  tags:
    type: checkbox
    label: 标签筛选
    description: 按标签过滤知识库，不选则检索全部
    options:
    - 财务
    - 人事
    - 客服
    - 技术

nodes:
- name: classify
  type: llm_classify
  label: 意图分类
  inputs:
    prompt: $params.query
    classify_system: |
      你是意图分类器，只允许输出以下标签之一，禁止输出其他内容：
      rag —— 需要查询知识库/文档/资料才能准确回答的事实性问题
      chat —— 问候、闲聊、创作、翻译等不需要检索的请求
    classify_labels:
    - rag
    - chat

- name: rewrite
  type: llm_rewrite_query
  label: 查询改写
  depends_on:
  - classify
  condition: $classify.intent == rag
  inputs:
    query: $params.query
    history: $params.history

- name: retrieve
  type: retrieve_knowledge
  label: 知识库检索
  depends_on:
  - rewrite
  inputs:
    queries: $rewrite.sub_queries
    tags: $params.tags

- name: answer
  type: llm_chat
  label: LLM回答
  depends_on:
  - classify
  - retrieve
  inputs:
    prompt: $params.query
    context: $retrieve.context
    system: |
      你是知识库问答助手。根据以下检索到的参考资料回答用户问题。
      如果资料中没有相关信息，请如实说明。
      回答要求简洁准确，必要时引用来源。

- name: __end__
  label: 输出
  depends_on:
  - answer
  type: end
  inputs:
    answer: $answer.content
    intent: $classify.intent
    sources: $retrieve.sources
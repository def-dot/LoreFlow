name: 工具调用
description: >
  LLM 自主决定是否调用工具，自动循环执行直到完成。

inputs:
  prompt:
    required: true
    multiline: true
    label: 用户问题
    description: 例如「北京今天天气怎么样」「帮我算一下 123 * 456」

output:
  answer: $agent.content

nodes:
  agent:
    type: agent
    label: 生活管家小助手
    description: LLM 自动调用工具回答问题
    inputs:
      system: >-
        你是一个智能助手。你可以使用提供的工具来回答问题。
        如果问题不需要工具就能回答，直接回复即可。
      tools:
        - get_weather
        - calculator
      max_iterations: 5
    timeout: 120

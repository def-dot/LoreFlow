name: 工具调用
description: 'LLM 自主决定是否调用工具，自动循环执行直到完成。

  '
nodes:
- name: agent
  type: agent
  label: 生活管家小助手
  description: LLM 自动调用工具回答问题
  inputs:
    prompt: $input.prompt
    system: 你是一个智能助手。你可以使用提供的工具来回答问题。 如果问题不需要工具就能回答，直接回复即可。
    tools:
    - web_search
    max_iterations: 5
  timeout: 120
- name: __end__
  label: 最终输出
  depends_on:
  - agent
  type: end
  inputs:
    answer: $agent.content
params:
  prompt:
    required: true
    type: paragraph
    label: 用户问题
    description: 例如「北京今天天气怎么样」「帮我算一下 123 * 456」

name: 工具调用
description: >
  演示 agent 节点：LLM 自主决定是否调用工具，自动循环执行直到完成。
  内置示例工具 get_weather / calculator，实际使用时替换为真实实现。

inputs:
  prompt:
    required: true
    multiline: true
    label: 用户问题
    description: 例如「北京今天天气怎么样」「帮我算一下 123 * 456」

output:
  answer: $agent.content

nodes:
  agent:
    type: agent
    label: 智能代理
    description: LLM 自动调用工具回答问题
    inputs:
      system: >-
        你是一个智能助手。你可以使用提供的工具来回答问题。
        如果问题不需要工具就能回答，直接回复即可。
      tools:
        - type: function
          function:
            name: get_weather
            description: 查询指定城市的当前天气信息
            parameters:
              type: object
              properties:
                city:
                  type: string
                  description: 城市名称，如"北京"、"上海"
              required:
                - city
        - type: function
          function:
            name: calculator
            description: 执行数学计算表达式并返回结果
            parameters:
              type: object
              properties:
                expression:
                  type: string
                  description: 数学表达式，如"123 * 456"、"sqrt(144)"
              required:
                - expression
      max_iterations: 5
    timeout: 120

name: 文件读取
description: 上传文件并输出文件内容。
nodes:
- name: load
  type: rag_load
  label: 读取文件
  inputs:
    document: $input.file
- name: end
  type: end
  label: 结束
  depends_on:
  - load
  inputs:
    output: $load.text
params:
  file:
    required: true
    type: file
    label: 上传文件
    description: 上传 txt/md 等文本文件
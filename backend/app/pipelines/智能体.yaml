name: 智能体
description: >
  通用智能助手，根据问题自主决定使用哪些工具：查天气、搜索、计算等。

inputs:
  prompt:
    required: true
    multiline: true
    label: 提示词
    description: 用户输入的问题
  skills:
    label: 技能
    description: 选择智能体可使用的技能
  tools:
    label: 工具
    description: 选择智能体可使用的工具
  file:
    file: true
    label: 上传文件
    description: 可选，上传文件供智能体分析

output:
  reply: $agent.content

nodes:
  agent:
    type: agent
    label: 智能助手
    description: 理解问题意图，自主规划调用工具，逐步推理直至解决
    inputs:
      system: >
        你是通用智能助手。你能使用工具完成任务，必须通过工具调用来使用工具。

        核心规则：
        - 禁止在回复文本中写工具调用，必须使用 function calling。
        - 禁止只描述方案而不执行，每次回复必须包含至少一个工具调用。
        - 读取技能文件后，立即调用 run_code 执行代码，不要停下来描述。
        - 如果工具执行出错，分析错误原因，修复后重新调用工具，不要放弃。
        - 需要安装包时，调用 pip_install，不要描述安装过程。
      prompt: $prompt
      skills: $skills
      tools: $tools
      file_paths: $file
      max_iterations: 10
    timeout: 300

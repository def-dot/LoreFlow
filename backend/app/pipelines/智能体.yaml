name: 智能体
description: >
  通用智能助手，根据问题自主决定使用哪些工具：查天气、搜索、计算等。

inputs:
  prompt:
    required: true
    multiline: true
    label: 提示词
    description: 用户输入的问题
  skills:
    label: 技能
    description: 选择智能体可使用的技能
  tools:
    label: 工具
    description: 选择智能体可使用的工具
  file:
    file: true
    label: 上传文件
    description: 可选，上传文件供智能体分析

output:
  reply: $agent.content

nodes:
  agent:
    type: agent
    label: 智能助手
    description: 理解问题意图，自主规划调用工具，逐步推理直至解决
    inputs:
      system: >
        你是通用智能助手。根据用户问题自主决定是否使用工具、使用哪个工具，
        可以多次调用不同工具直到问题解决。
      prompt: $prompt
      skills: $skills
      tools: $tools
      file_paths: $file
      max_iterations: 10
    timeout: 300

name: 自定义插件
description: 内容发布后发送邮件通知。

inputs:
  title:
    required: true
    label: 标题
    description: 待审核文章标题
  content:
    required: true
    label: 正文
    description: 待审核文章正文
    multiline: true

nodes:
  review:
    type: human
    label: 内容审核
    description: "请审核文章内容是否可以发布"
    inputs:
      # 声明即卡片：title/content 是参数键，值已在 ctx，直引即可
      _review: {$title: 标题, $content: 正文}

  publish:
    type: cfg_publish
    label: 内容发布
    depends_on: [review]
    inputs:
      title: $review.decision.title
      content: $review.decision.content

  notify:
    type: send_email
    label: 邮件通知
    depends_on: [publish]
    inputs:
      subject: $review.decision.title
      body: $review.decision.content
      to: defdot36@gmail.com

name: 自定义插件
description: 内容发布后发送邮件通知。
nodes:
- name: __start__
  type: start
  inputs:
    title:
      required: true
      label: 标题
      description: 待审核文章标题
    content:
      required: true
      label: 正文
      description: 待审核文章正文
      type: paragraph
- name: review
  type: human
  label: 内容审核
  description: 请审核文章内容是否可以发布
  inputs:
    payload:
      - key: title
        label: 标题
        value: $__start__.title
      - key: content
        label: 正文
        value: $__start__.content
- name: publish
  type: publish
  label: 内容发布
  depends_on:
  - review
  inputs:
    title: $review.result.title
    content: $review.result.content
- name: notify
  type: send_email
  label: 邮件通知
  depends_on:
  - review
  - publish
  inputs:
    subject: $review.result.title
    body: $review.result.content
    to: defdot36@gmail.com

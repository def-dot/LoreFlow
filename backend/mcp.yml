# MCP 服务器配置
# 每个条目连接一个 MCP server，其工具自动注册到 agent 工具列表。
#
# transport:
#   sse   — HTTP SSE 远程服务（url 必填）
#   http  — Streamable HTTP 远程服务（url 必填，如 http://localhost:8080/mcp）
#   stdio — 本地子进程（command + args 必填）
#
# env（可选，仅 stdio）— 传给子进程的环境变量，值支持 ${VAR} 引用当前进程环境变量。
# timeout（可选）— 单次工具调用超时秒数，默认 60；设为 null 可禁用。
#
servers:
  - name: 系统监控MCP
    transport: stdio
    command: uv
    args: ["run", "python", "app/mcps/system_monitor.py"]

  - name: 文件系统MCP
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/rag/LoreFlow"]

  - name: 数据库MCP
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@bytebase/dbhub@latest"
      - "--transport"
      - "stdio"
      - "--dsn"
      - "postgresql://postgres:postgres@localhost:5432/loreflow?sslmode=disable"

  # Notion — 在 https://www.notion.so/profile/integrations 创建 internal integration，
  # 把 ntn_ 开头的 token 写入环境变量 NOTION_TOKEN，并把目标页面/数据库接入该 integration。
  - name: NotionMCP
    transport: stdio
    command: npx
    args: ["-y", "@notionhq/notion-mcp-server"]
    env:
      NOTION_TOKEN: ${NOTION_TOKEN}

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loreflow"
version = "0.1.0"
description = "DAG Flow — async DAG-based workflow orchestration engine with declarative YAML config and human-in-the-loop review"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlmodel==0.0.24",
    "pydantic==2.11.3",
    "pydantic-settings>=2.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.22.1",
    "alembic>=1.13",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff",
    "pre-commit",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.pipelines" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 集成测试，需要外部服务（PostgreSQL 等）运行"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_decorators = false
exclude = ["alembic"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

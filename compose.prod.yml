services:
  db:
    ports: !override []

  redis:
    ports: !override []

  arq-parse:
    image: loreflow-backend:latest
    command: arq app.arq_worker.ParseWorkerSettings
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/parsed:/app/parsed

  arq-default:
    image: loreflow-backend:latest
    command: arq app.arq_worker.DefaultWorkerSettings
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: loreflow-backend:latest
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/parsed:/app/parsed
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: loreflow-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy


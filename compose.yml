services:
  db:
    build:
      context: .
      dockerfile: postgres/Dockerfile.postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER?variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?variable not set}
      POSTGRES_DB: ${POSTGRES_DB?variable not set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.6
    container_name: bge-m3-embed
    command: >
      --model-id /data
      --max-client-batch-size ${TEI_BATCH_SIZE:-16}
    volumes:
      - ../hub/bge-m3:/data
    ports:
      - "8081:80"
    environment:
      - HF_HUB_OFFLINE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.6
    container_name: bge-reranker
    command: >
      --model-id /data
      --max-client-batch-size ${TEI_BATCH_SIZE:-16}
    volumes:
      - ../hub/bge-reranker-v2-m3:/data
    ports:
      - "8082:80"
    environment:
      - HF_HUB_OFFLINE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sandbox:
    image: python:3.12-slim
    restart: unless-stopped
    command: python -u /runner.py
    init: true
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "${SANDBOX_PORT:-8194}:8194"
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./sandbox/runner.py:/runner.py:ro
      - sandbox-packages:/opt/packages
      - ./backend/uploads:/uploads
    environment:
      PYTHONPATH: /opt/packages

volumes:
  pgdata:
  redisdata:
  sandbox-packages: